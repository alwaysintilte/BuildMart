databaseChangeLog:
  - changeSet:
      id: create-carts-table
      author: alwaysintilte
      changes:
        - createTable:
            tableName: carts
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_carts_user_id
              - column:
                  name: promo_code_id
                  type: BIGINT
        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_carts_user
        - addForeignKeyConstraint:
            baseTableName: carts
            baseColumnNames: promo_code_id
            referencedTableName: promo_codes
            referencedColumnNames: id
            constraintName: fk_carts_promo_code
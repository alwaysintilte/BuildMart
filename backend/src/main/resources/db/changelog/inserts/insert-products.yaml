databaseChangeLog:
  - changeSet:
      id: insert-products
      author: alwaysintilte
      changes:
        - insert:
            tableName: products
            columns:
              - column: { name: title, value: "Exterior Paint Set" }
              - column: { name: rating, valueNumeric: 3.5 }
              - column: { name: price, valueNumeric: 45.99 }
              - column: { name: discount, valueNumeric: 20 }
              - column: { name: product_category, value: "PAINT_AND_COATINGS" }
              - column: { name: description, value: "Professional-grade exterior paint set designed to withstand harsh weather conditions. This premium paint offers excellent coverage, durability, and color retention. Perfect for residential and commercial exterior surfaces." }
              - column: { name: stock_quantity, valueNumeric: 10 }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
        - insert:
            tableName: products
            columns:
              - column: { name: title, value: "Plywood Sheets" }
              - column: { name: rating, valueNumeric: 4.5 }
              - column: { name: price, valueNumeric: 52.99 }

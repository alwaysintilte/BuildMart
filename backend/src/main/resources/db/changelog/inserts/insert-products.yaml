              - column: { name: product_category, value: "WOOD_AND_LUMBER" }
              - column: { name: description, value: "Versatile construction-grade plywood sheets suitable for a wide range of applications. These sheets are engineered for strength and dimensional stability, perfect for subfloors, roofing, walls, and general construction." }
              - column: { name: stock_quantity, valueNumeric: 10 }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
        - insert:
            tableName: products

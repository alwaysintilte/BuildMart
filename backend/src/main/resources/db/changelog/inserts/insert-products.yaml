              - column: { name: description, value: "Premium kiln-dried lumber planks perfect for all your woodworking and construction needs. These high-grade wooden planks are carefully selected for strength and appearance. Suitable for framing, decking, furniture making, and various carpentry projects." }
              - column: { name: stock_quantity, valueNumeric: 10 }

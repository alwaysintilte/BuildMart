<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | BuildMart</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-[#F9FAFB]">

<div class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-[#E5E7EB]">
        <div class="max-w-7xl mx-auto px-4 md:px-6 lg:px-8 h-20 flex items-center">
            <a href="index.html" class="flex items-center gap-2">
                <div class="size-10 rounded-[10px] bg-[#F54900] flex items-center justify-center">
                    <span class="text-white font-bold text-xl">BM</span>
                </div>
                <span class="text-xl font-bold text-[#101828]">BuildMart</span>
            </a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center px-4 py-12">

        <div class="w-full max-w-md bg-white border border-[#E5E7EB] rounded-xl shadow-sm p-8">

            <h1 class="text-3xl font-bold text-[#101828] text-center mb-2">
                Create Account
            </h1>

            <p class="text-[#6A7282] text-center mb-8">
                Join BuildMart to start shopping
            </p>

            <form id="register-form" class="flex flex-col gap-5">

                <div>
                    <label for="email" class="block text-sm font-medium text-[#364153] mb-2">
                        Email
                    </label>

                    <input
                            id="email"
                            type="email"
                            required
                            autocomplete="email"
                            placeholder="Enter your email"
                            class="w-full px-4 py-3 border border-[#D1D5DC] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F54900]"
                    >
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-[#364153] mb-2">
                        Password
                    </label>

                    <input
                            id="password"
                            type="password"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Create a password"
                            class="w-full px-4 py-3 border border-[#D1D5DC] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F54900]"
                    >
                </div>

                <div>
                    <label for="confirm-password" class="block text-sm font-medium text-[#364153] mb-2">
                        Confirm Password
                    </label>

                    <input
                            id="confirm-password"
                            type="password"
                            required
                            minlength="8"
                            autocomplete="new-password"
                            placeholder="Repeat your password"
                            class="w-full px-4 py-3 border border-[#D1D5DC] rounded-lg focus:outline-none focus:ring-2 focus:ring-[#F54900]"
                    >
                </div>

                <p id="register-error" class="text-sm text-red-600 hidden"></p>

                <button
                        id="register-button"
                        type="submit"
                        class="w-full py-3 bg-[#F54900] hover:bg-[#b53600] text-white font-semibold rounded-lg transition"
                >
                    Create Account
                </button>

            </form>

            <p class="text-center text-sm text-[#6A7282] mt-6">
                Already have an account?
                <a href="login.html" class="text-[#F54900] font-semibold hover:underline">
                    Log In
                </a>
            </p>

        </div>

    </main>

</div>

<script type="module" src="../scripts/registerPage.js"></script>
</body>
</html>
